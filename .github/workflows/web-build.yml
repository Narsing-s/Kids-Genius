name: Web app build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Install only the web and shared-learning workspaces. The Expo mobile
      # workspace intentionally uses React 18 while the web app uses React 19.
      - run: npm install --workspace @kids-genius/web --include-workspace-root=false
      - run: npm run build:web
